# Production profile, to run Scorewright locally as it runs in production (there is no deployment): the prod target
# of backend/Dockerfile, with the code, its dependencies and the built frontend in the image, and one port where Caddy
# serves the frontend and hands /api to PHP. See README.md, "Production".
#
#   cp .env.prod.example .env.prod      then set its three secrets
#   docker compose -f compose.prod.yaml --env-file .env.prod up -d --build --wait      then open http://localhost:8490
#
# Its settings come from .env.prod, never from the development stack's .env, and its secrets have names of their own
# (PROD_*). With a secret missing or empty, Compose refuses before it starts anything, so the database is never created
# with a password you did not choose. The app also refuses the !ChangeMe! placeholders of the development stack.
name: scorewright-prod

x-backend: &backend
  build:
    context: ./backend
    target: prod
    additional_contexts:
      frontend: ./frontend
  restart: unless-stopped
  # When the database is down, its name stops resolving, and Docker's DNS takes about 4 s to say so, for each
  # connection: at most 2 s here (two tries of 1 s, so one lost packet does not fail a lookup, such as Caddy's for
  # its certificates), and the 503 comes sooner.
  dns_opt: ["timeout:1", "attempts:2"]
  environment: &backend-env
    APP_SECRET: ${PROD_APP_SECRET:?set PROD_APP_SECRET in .env.prod (README, Production)}
    DATABASE_URL: postgresql://app_runtime:${PROD_APP_DATABASE_PASSWORD:?set PROD_APP_DATABASE_PASSWORD in .env.prod (README, Production)}@db:5432/app?serverVersion=18&charset=utf8
    # Behind a proxy that terminates TLS: its address (or private_ranges), so that X-Forwarded-For and
    # X-Forwarded-Proto count. Empty: no proxy is trusted, and the client is the one that connects.
    SYMFONY_TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
    # The host names the API answers to, as regular expressions separated by commas; it answers 400 to any other Host.
    SYMFONY_TRUSTED_HOSTS: ${TRUSTED_HOSTS:-^(localhost|127\.0\.0\.1)$$}

services:
  app:
    <<: *backend
    environment:
      <<: *backend-env
      DATABASE_OWNER_URL: postgresql://app:${PROD_POSTGRES_PASSWORD:?set PROD_POSTGRES_PASSWORD in .env.prod (README, Production)}@db:5432/app?serverVersion=18&charset=utf8
      # A domain name: Caddy gets a certificate and serves HTTPS on ports 80 and 443, which you then publish (README,
      # "Production"). Unset: plain HTTP on port 80, for a proxy in front that terminates TLS.
      SERVER_NAME: ${SERVER_NAME:-:80}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 127.0.0.1:${PROD_PORT:-8490}:80
    # Caddy's certificates and its local CA, kept when the container is recreated.
    volumes:
      - caddy_data:/data
    # The health listener on the loopback (Caddyfile.prod): no public host name, no TLS, so it works in every mode.
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:2020/api/health') === false ? 1 : 0);"]
      start_period: 2m
      start_interval: 2s
      interval: 30s

  worker:
    <<: *backend
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M"]
    deploy:
      replicas: 2
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${PROD_POSTGRES_PASSWORD:?set PROD_POSTGRES_PASSWORD in .env.prod (README, Production)}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "app"]
      interval: 2s
      retries: 30

volumes:
  db_data:
  caddy_data:
