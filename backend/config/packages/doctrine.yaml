doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'
        # At most 2 s to connect (pdo_pgsql's connect_timeout, which it sets itself: a connect_timeout in the URL does
        # not reach it), so a database that does not answer gives a 503 quickly (SWQ4-08). The session handler too
        # (services.yaml).
        options:
            !php/const PDO::ATTR_TIMEOUT: 2

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            Users:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Users/Entity'
                prefix: 'App\Users\Entity'
            Projects:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Projects/Entity'
                prefix: 'App\Projects\Entity'
            Datasets:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Datasets/Entity'
                prefix: 'App\Datasets\Entity'
            Evaluations:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Evaluations/Entity'
                prefix: 'App\Evaluations\Entity'

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
