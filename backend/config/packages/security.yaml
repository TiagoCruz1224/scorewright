security:
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    providers:
        users:
            entity:
                class: App\Users\Entity\User

    firewalls:
        main:
            lazy: true
            provider: users
            json_login:
                check_path: auth_login
                username_path: email
                password_path: password
                failure_handler: App\Users\Security\LoginFailureHandler
            logout:
                path: auth_logout
            # 5 attempts per minute per email and IP, and 25 per IP.
            login_throttling: ~

    # Deny by default: every path needs a signed-in user unless it is listed here, including a route someone adds
    # outside /api. (No remember-me, so IS_AUTHENTICATED is the same as IS_AUTHENTICATED_FULLY.)
    access_control:
        - { path: ^/api/(health|auth/(register|login|logout))$, roles: PUBLIC_ACCESS }
        - { path: ^/, roles: IS_AUTHENTICATED }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
