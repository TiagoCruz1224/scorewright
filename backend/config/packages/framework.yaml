# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'

    # Sessions live in PostgreSQL (ADR 0002) and expire after 8 hours without a request.
    # SYMFONY_TRUSTED_PROXIES and SYMFONY_TRUSTED_HOSTS set the proxies and the host names (compose.yaml,
    # compose.prod.yaml). From a trusted proxy, only the client's address and the scheme count: the proxy keeps the
    # Host header, as the Vite proxy does (changeOrigin: false).
    trusted_headers: ['x-forwarded-for', 'x-forwarded-proto']

    session:
        handler_id: Symfony\Component\HttpFoundation\Session\Storage\Handler\PdoSessionHandler
        # __Host-: the browser only keeps it if it is Secure, has Path=/ and no Domain, so no subdomain or plain-HTTP
        # page can set or overwrite it (SWQ1-11). Browsers treat http://localhost as secure, so development works too.
        name: __Host-scorewright
        cookie_path: /
        cookie_secure: true
        cookie_httponly: true
        cookie_samesite: lax
        gc_maxlifetime: 28800

    # Stateless CSRF check (Origin/Referer/Sec-Fetch-Site plus the csrf-token header), applied to every unsafe /api
    # request by App\Http\CsrfListener.
    csrf_protection:
        stateless_token_ids: [api]
        check_header: true

    # Registering and inviting both reveal whether an account exists (architecture §9): limit them, and limit new
    # projects too, so that creating projects gives no extra invites. A 429 carries Retry-After.
    rate_limiter:
        registration:
            policy: sliding_window
            limit: 10 # per client IP
            interval: '1 hour'
        project_invite:
            policy: sliding_window
            limit: 20 # per inviting user, across all their projects
            interval: '1 hour'
        project_create:
            policy: sliding_window
            limit: 30 # per user
            interval: '1 hour'

    # Unknown request fields are rejected (422) instead of ignored.
    serializer:
        default_context:
            allow_extra_attributes: false

    # Client errors (4xx, unknown fields) are not server errors: log them as notices, not as errors.
    exceptions:
        Symfony\Component\HttpKernel\Exception\HttpExceptionInterface:
            log_level: notice
        Symfony\Component\Serializer\Exception\ExtraAttributesException:
            log_level: notice

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file
