expose_php = Off
date.timezone = UTC

; Errors go to the log (the container output), never into a response: a PHP warning printed before the headers
; turned an error into "200 OK text/html". Also in development; Symfony's error pages are not affected.
display_errors = Off
log_errors = On

; Request body limit: a 5 MB import file plus the multipart overhead (architecture §9). Caddy's request_body
; max_size (Caddyfile) is 8 MiB, above this, so that Symfony answers the bodies in between with 413 problem+json.
post_max_size = 6M
upload_max_filesize = 6M
