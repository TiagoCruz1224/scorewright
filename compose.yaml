# Development stack: `docker compose up`, then open http://localhost:5471 (see README.md).
x-backend: &backend
  build: ./backend
  restart: unless-stopped
  environment:
    APP_SECRET: ${APP_SECRET:-!ChangeMe!}
    DATABASE_URL: postgresql://app:${POSTGRES_PASSWORD:-!ChangeMe!}@db:5432/app?serverVersion=18&charset=utf8
  volumes:
    - ./backend:/app
    # vendor/ and var/ stay in named volumes: bind mounts from a Windows or macOS host are slow,
    # and these two directories hold most of the files PHP reads.
    - backend_vendor:/app/vendor
    - backend_var:/app/var

services:
  app:
    <<: *backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Bound to the loopback interface only: the dev stack uses placeholder secrets.
      - 127.0.0.1:${APP_PORT:-8471}:80
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/api/health') === false ? 1 : 0);"]
      start_period: 5m
      start_interval: 2s
      interval: 30s

  # Same image; starts once `app` has installed the dependencies and run the migrations.
  worker:
    <<: *backend
    command: ["php", "bin/console", "messenger:consume", "async", "--time-limit=3600", "--memory-limit=256M"]
    # Two consumers: a slow job (one whose regex patterns take seconds) does not hold up everyone else's (SWQ3-01).
    # The transport hands each message to one of them, and the handler locks the job, so a job never runs twice.
    deploy:
      replicas: 2
    # The image's health check probes Caddy, which the worker does not run.
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_healthy

  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-!ChangeMe!}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18/.
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "app"]
      interval: 2s
      retries: 30

  # Vite dev server; forwards /api to `app`, so the browser sees one origin.
  frontend:
    image: node:26-alpine
    working_dir: /app
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://app
      WATCH_POLLING: "true"
      NPM_CONFIG_UPDATE_NOTIFIER: "false"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - 127.0.0.1:${FRONTEND_PORT:-5471}:5173

volumes:
  backend_vendor:
  backend_var:
  frontend_node_modules:
  db_data:
